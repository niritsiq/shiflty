<title>Shiftly</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1117">
<link rel="icon" href="assets/cybereason-logo.png" type="image/png">
<link rel="apple-touch-icon" href="assets/cybereason-logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  /* ---------- Design tokens : night-shift SOC ---------- */
  :root {
    --bg: #0E1117;
    --card: #171B24;
    --card-2: #212734;
    --text: #F2F4F8;
    --text-2: #A7B0C0;
    --text-3: #8B93A7;
    --sep: rgba(255,255,255,0.08);
    --accent: #C4B5FD;
    --accent-fill: #7B3FE4;
    --accent-soft: rgba(123,63,228,0.22);
    --accent-2: #00C2A8;
    --on-accent: #FFFFFF;
    --good: #3DDC97;
    --good-soft: rgba(61,220,151,0.16);
    --warn: #FF9F43;
    --warn-soft: rgba(255,159,67,0.16);
    --bad: #FF5D73;
    --bad-soft: rgba(255,93,115,0.16);
    --morning: #F5B942;
    --morning-soft: rgba(245,185,66,0.16);
    --evening: #00C2A8;
    --evening-soft: rgba(0,194,168,0.16);
    --night: #9AA6FF;
    --night-soft: rgba(154,166,255,0.16);
    --chip: #2A3142;
    --bar: rgba(14,17,23,0.86);
    --shadow: 0 1px 0 rgba(255,255,255,0.04), 0 16px 40px rgba(0,0,0,0.45);
    --thumb-shadow: 0 1px 3px rgba(0,0,0,0.55);
    --logo-plate: #F4F5F7;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --radius: 8px;
    --radius-lg: 12px;
    /* Strong custom curves — built-in CSS easings are too weak */
    --ease-out-strong: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out-strong: cubic-bezier(0.77, 0, 0.175, 1);
    --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; color-scheme: dark; }
  body {
    background:
      radial-gradient(880px 460px at -8% -18%, rgba(123,63,228,0.22), transparent 58%),
      radial-gradient(640px 380px at 108% -12%, rgba(0,194,168,0.12), transparent 52%),
      var(--bg);
    color: var(--text);
    font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 15px;
    line-height: 1.45;
  }
  .mono, .day-date, .wk-label, .secret-box, .shift-badge small, .s-label small,
  .ts-name small, .mysched-row .d small, .td-head small, .matrix th small,
  .stat .v, input[type="time"], #si-code, .count {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  input, select, textarea {
    font: inherit; color: var(--text);
    background: var(--card-2);
    border: 1px solid var(--sep);
    border-radius: var(--radius);
    padding: 10px 14px;
    outline: none;
    width: 100%;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) {
    /* gentler, not zero: keep color/opacity fades, drop movement */
    * { animation: none !important; }
    .picker, .toast, .toggle .knob, .cell, .btn, .icon-btn, .addbtn, .pick-row {
      transition-property: opacity, background-color, border-color, color !important;
    }
    .toast { transform: translate(-50%, 0); }
    .picker { transform: none; }
  }

  /* ---------- Layout ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: var(--bar);
    -webkit-backdrop-filter: saturate(140%) blur(16px);
    backdrop-filter: saturate(140%) blur(16px);
    border-bottom: 1px solid var(--sep);
  }
  .topbar::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent-fill), var(--accent-2));
    pointer-events: none;
  }
  .topbar-inner {
    max-width: 1060px; margin: 0 auto; padding: 10px 20px;
    display: flex; align-items: center; gap: 14px;
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
  .brand-logo {
    width: 24px; height: 24px; border-radius: 5px;
    background: var(--logo-plate);
    object-fit: contain;
    display: block;
  }
  .spacer { flex: 1; }
  .userbox { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-2); }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px;
  }
  .signout { color: var(--accent); font-weight: 500; font-size: 13px; }

  .container { max-width: 1060px; margin: 0 auto; padding: 24px 20px 80px; }

  .page-title { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; margin: 6px 0 2px; text-wrap: balance; }
  .page-sub { color: var(--text-2); margin: 0 0 20px; }

  /* Segmented control */
  .seg {
    display: inline-flex; background: var(--chip); border-radius: var(--radius); padding: 3px; gap: 2px;
    margin-bottom: 22px; max-width: 100%; overflow-x: auto;
  }
  .seg button {
    padding: 7px 16px; border-radius: 6px; font-size: 14px; font-weight: 600;
    color: var(--text-2); white-space: nowrap;
    transition: background-color 180ms var(--ease-out-strong), color 180ms ease;
  }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: var(--thumb-shadow); }

  /* Week nav */
  .weeknav { display: flex; align-items: center; gap: 6px; }
  .weeknav .wk-label { font-weight: 600; font-size: 14px; min-width: 150px; text-align: center; font-variant-numeric: tabular-nums; }
  .icon-btn {
    width: 32px; height: 32px; border-radius: var(--radius); background: var(--chip);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 15px; color: var(--text);
    transition: background-color 150ms ease, transform 160ms var(--ease-out-strong);
  }
  .icon-btn:active { transform: scale(0.92); }

  .card {
    background: var(--card); border-radius: var(--radius-lg); box-shadow: var(--shadow);
    border: 1px solid var(--sep);
    padding: 20px; margin-bottom: 16px;
  }
  .card h3 { margin: 0 0 4px; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .card .sub { color: var(--text-2); font-size: 13px; margin: 0 0 14px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    background: var(--accent-fill); color: var(--on-accent);
    border-radius: var(--radius); padding: 10px 18px; font-weight: 600; font-size: 15px;
    transition: filter 160ms ease, transform 160ms var(--ease-out-strong);
  }
  .btn:active { transform: scale(0.97); }
  .btn.secondary { background: var(--chip); color: var(--text); }
  .btn.small { padding: 6px 14px; font-size: 13px; }
  .btn.danger { background: var(--bad-soft); color: var(--bad); }
  .btn:disabled { opacity: .5; cursor: default; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    border-radius: 6px; padding: 3px 8px; font-size: 12px; font-weight: 600;
  }
  .pill.good { background: var(--good-soft); color: var(--good); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad  { background: var(--bad-soft);  color: var(--bad); }
  .pill.neutral { background: var(--chip); color: var(--text-2); }
  .pill.accent { background: var(--accent-soft); color: var(--accent); }

  .shift-pill {
    display: inline-flex; align-items: center;
    border-radius: 6px; padding: 2px 8px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.03em;
    background: var(--chip); color: var(--text-2);
  }
  .shift-pill.morning, .shift-badge.morning { background: var(--morning-soft); color: var(--morning); }
  .shift-pill.evening, .shift-badge.evening { background: var(--evening-soft); color: var(--evening); }
  .shift-pill.night, .shift-badge.night { background: var(--night-soft); color: var(--night); }
  .mini.morning { box-shadow: inset 0 -2px 0 var(--morning); }
  .mini.evening { box-shadow: inset 0 -2px 0 var(--evening); }
  .mini.night { box-shadow: inset 0 -2px 0 var(--night); }

  /* ---------- Sign-in ---------- */
  .signin-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background:
      radial-gradient(520px 280px at 50% 18%, rgba(123,63,228,0.20), transparent 70%),
      var(--bg);
  }
  .signin-card {
    position: relative; overflow: hidden;
    width: 100%; max-width: 400px; background: var(--card); border-radius: var(--radius-lg);
    border: 1px solid var(--sep);
    box-shadow: var(--shadow); padding: 36px 32px; text-align: center;
  }
  .signin-card::before {
    content: "";
    position: absolute; left: 0; right: 0; top: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent-fill), var(--accent-2));
  }
  .signin-logo {
    width: 64px; height: 64px; border-radius: var(--radius);
    margin: 4px auto 16px;
    background: var(--logo-plate);
    object-fit: contain;
    display: block;
  }
  .signin-card h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; margin: 0 0 6px; }
  .signin-card p { color: var(--text-2); margin: 0 0 24px; font-size: 14px; }
  .signin-card form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
  .signin-card label { font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: -6px; }
  .signin-err { color: var(--bad); font-size: 13px; margin: 4px 0 0; }
  .signin-foot { margin-top: 20px; font-size: 12px; color: var(--text-3); }
  .qr-box {
    background: #fff; border-radius: var(--radius); padding: 14px;
    width: 208px; max-width: 100%; margin: 0 auto 12px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
  }
  .qr-box svg { display: block; width: 100%; height: auto; }
  .signin-card.enroll { max-width: 460px; }
  .signin-card p.enroll-note {
    margin: 0 0 10px; font-size: 13px; text-align: left; color: var(--text-2);
  }
  .enroll { text-align: left; }
  .enroll-steps {
    margin: 0 0 14px; padding-left: 18px;
    color: var(--text-2); font-size: 13px;
  }
  .enroll-steps li { margin: 0 0 6px; }
  .enroll-steps b { color: var(--text); }
  .setup-meta {
    background: var(--card-2); border: 1px solid var(--sep); border-radius: var(--radius);
    padding: 8px 12px; margin: 0 0 12px; font-size: 13px;
  }
  .setup-meta div { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
  .setup-meta span { color: var(--text-2); }
  .setup-meta b { font-weight: 600; text-align: right; word-break: break-all; }
  .setup-label {
    font-size: 12px; font-weight: 600; color: var(--text-2);
    text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 6px;
  }
  .secret-box {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--card-2); border: 1px solid var(--sep); border-radius: 6px; padding: 12px;
    font-size: 16px; line-height: 1.55; letter-spacing: 0.06em; text-align: center;
    white-space: pre-line;
    user-select: all; -webkit-user-select: all; margin-bottom: 10px;
  }
  .enroll-details { margin: 0 0 8px; }
  .enroll-details summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 600; }
  .enroll-restart { display: block; margin: 0 0 14px; }

  /* ---------- Worker availability grid ---------- */
  .avail-grid { display: flex; flex-direction: column; gap: 10px; }
  .day-row {
    display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center;
    padding: 12px 14px; background: var(--card-2); border-radius: var(--radius);
  }
  .day-name { font-weight: 700; font-size: 14px; }
  .day-date { color: var(--text-2); font-size: 12px; font-variant-numeric: tabular-nums; }
  .shift-cells { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cell {
    border-radius: var(--radius); padding: 9px 6px; text-align: center;
    background: var(--card); border: 1.5px solid var(--sep);
    transition: background-color 140ms ease, border-color 140ms ease, transform 160ms var(--ease-out-strong);
    user-select: none; -webkit-user-select: none;
  }
  .cell:active { transform: scale(0.95); }
  .cell .c-name { font-size: 12px; font-weight: 600; display: block; }
  .cell .c-name.shift-pill { display: inline-flex; margin-bottom: 2px; }
  .cell .c-state { font-size: 11px; display: block; margin-top: 2px; color: var(--text-3); font-weight: 500; }
  .cell.yes  { background: var(--good-soft); border-color: var(--good); }
  .cell.yes .c-state { color: var(--good); }
  .cell.pref { background: var(--accent-soft); border-color: var(--accent); }
  .cell.pref .c-state { color: var(--accent); }
  .cell.no   { background: var(--bad-soft); border-color: var(--bad); }
  .cell.no .c-state { color: var(--bad); }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 14px 0 0; font-size: 12px; color: var(--text-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .dot.d-yes { background: var(--good); } .dot.d-pref { background: var(--accent); }
  .dot.d-no { background: var(--bad); } .dot.d-unset { background: var(--chip); border: 1px solid var(--sep); }

  .submit-bar { display: flex; align-items: center; gap: 14px; margin-top: 18px; flex-wrap: wrap; }
  .submit-note { color: var(--text-2); font-size: 13px; }

  /* ---------- My schedule ---------- */
  .mysched { display: flex; flex-direction: column; gap: 8px; }
  .mysched-row {
    display: flex; align-items: center; gap: 14px; padding: 13px 16px;
    background: var(--card-2); border-radius: var(--radius);
  }
  .mysched-row .d { width: 110px; font-weight: 700; font-size: 14px; }
  .mysched-row .d small { display: block; font-weight: 400; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .shift-badge {
    display: inline-flex; flex-direction: column; padding: 6px 12px; border-radius: 6px;
    background: var(--chip); color: var(--text);
  }
  .shift-badge b { font-size: 13px; }
  .shift-badge small { font-size: 11px; opacity: .85; font-variant-numeric: tabular-nums; }
  .off { color: var(--text-3); font-size: 13px; }

  /* Worker: full team schedule */
  .team-day { padding: 11px 0; border-bottom: 1px solid var(--sep); }
  .team-day:last-child { border-bottom: none; padding-bottom: 0; }
  .td-head { font-weight: 700; font-size: 13px; margin-bottom: 7px; }
  .td-head small { color: var(--text-2); font-weight: 400; font-variant-numeric: tabular-nums; }
  .team-shift-row { display: flex; align-items: flex-start; gap: 10px; padding: 3px 0; }
  .ts-name { width: 140px; flex-shrink: 0; font-size: 12px; font-weight: 600; color: var(--text-2); padding-top: 3px; }
  .ts-name small { font-weight: 400; color: var(--text-3); font-variant-numeric: tabular-nums; display: block; }
  .ts-people { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; }
  .ts-chip {
    display: inline-flex; background: var(--card-2); border-radius: 6px;
    padding: 4px 12px; font-size: 12px; font-weight: 500;
  }
  .ts-chip.me { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  /* ---------- Admin: availability matrix ---------- */
  .matrix-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px; }
  table.matrix { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 760px; }
  .matrix th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--text-2); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--sep);
    white-space: nowrap;
  }
  .matrix th small { display: block; text-transform: none; letter-spacing: 0; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .matrix td { padding: 9px 10px; border-bottom: 1px solid var(--sep); vertical-align: middle; }
  .matrix tr:last-child td { border-bottom: none; }
  .emp-cell { display: flex; align-items: center; gap: 10px; min-width: 150px; }
  .emp-cell .nm { font-weight: 600; font-size: 13px; white-space: nowrap; }
  .emp-cell .st { font-size: 11px; color: var(--text-3); }
  .mini-cells { display: flex; gap: 4px; }
  .mini {
    width: 22px; height: 22px; border-radius: 6px; font-size: 10px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--chip); color: var(--text-3); border: 1px solid transparent;
  }
  .mini.yes { background: var(--good-soft); color: var(--good); }
  .mini.pref { background: var(--accent-soft); color: var(--accent); }
  .mini.no { background: var(--bad-soft); color: var(--bad); }

  /* ---------- Admin: schedule builder ---------- */
  .sched-day { margin-bottom: 14px; }
  .sched-day-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .sched-day-head h4 { margin: 0; font-size: 15px; font-weight: 700; }
  .sched-day-head small { color: var(--text-2); font-variant-numeric: tabular-nums; }
  .shift-row {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 14px; background: var(--card-2); border-radius: var(--radius); margin-bottom: 6px;
  }
  .shift-row .s-label { width: 130px; }
  .shift-row .s-label b { font-size: 13px; display: block; }
  .shift-row .s-label small { display: block; margin-top: 4px; color: var(--text-2); font-size: 11px; font-variant-numeric: tabular-nums; }
  .assigned { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--card); border: 1px solid var(--sep);
    border-radius: 6px; padding: 4px 6px 4px 10px; font-size: 13px; font-weight: 500;
  }
  .chip .x {
    width: 18px; height: 18px; border-radius: 50%; background: var(--chip);
    font-size: 11px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-2);
  }
  .chip.warnchip { border-color: var(--warn); background: var(--warn-soft); }
  .addbtn {
    border: 1.5px dashed var(--text-3); color: var(--text-2); border-radius: 6px;
    padding: 4px 14px; font-size: 13px; font-weight: 500;
    transition: color 150ms ease, border-color 150ms ease, transform 160ms var(--ease-out-strong);
  }
  .addbtn:active { transform: scale(0.96); }
  .count { font-variant-numeric: tabular-nums; }

  /* Picker */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    opacity: 1; transition: opacity 200ms ease-out;
  }
  .picker {
    background: var(--card); border-radius: var(--radius-lg); border: 1px solid var(--sep); box-shadow: var(--shadow);
    width: 100%; max-width: 420px; max-height: 76vh; overflow-y: auto; padding: 22px;
    opacity: 1; transform: translateY(0) scale(1);
    transition: opacity 200ms var(--ease-out-strong), transform 280ms var(--ease-sheet);
  }
  @starting-style {
    .overlay { opacity: 0; }
    .picker { opacity: 0; transform: translateY(12px) scale(0.97); }
  }
  .picker h4 { margin: 0 0 2px; font-size: 16px; }
  .picker .sub { color: var(--text-2); font-size: 13px; margin: 0 0 14px; }
  .pick-group { margin-bottom: 12px; }
  .pick-group .g-label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; margin-bottom: 6px; }
  .pick-group.g-pref .g-label { color: var(--accent); }
  .pick-group.g-yes .g-label { color: var(--good); }
  .pick-group.g-unset .g-label { color: var(--text-3); }
  .pick-group.g-no .g-label { color: var(--bad); }
  .pick-row {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 9px 10px; border-radius: var(--radius); text-align: left;
    transition: background-color 140ms ease, transform 160ms var(--ease-out-strong);
  }
  .pick-row:active { transform: scale(0.98); }
  .pick-row .nm { font-weight: 600; font-size: 14px; flex: 1; }
  .pick-row .meta { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .picker-close { margin-top: 8px; width: 100%; }

  /* ---------- Team ---------- */
  .team-row { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--sep); }
  .team-row:last-child { border-bottom: none; }
  .team-row .info { flex: 1; min-width: 0; }
  .team-row .info b { display: block; font-size: 14px; }
  .team-row .info small { color: var(--text-2); font-size: 12px; overflow-wrap: anywhere; }
  .team-add { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; margin-top: 14px; }

  /* ---------- Settings ---------- */
  .set-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--sep); flex-wrap: wrap; }
  .set-row:last-child { border-bottom: none; }
  .set-row .lbl { flex: 1; min-width: 160px; }
  .set-row .lbl b { display: block; font-size: 14px; font-weight: 600; }
  .set-row .lbl .shift-pill { margin-bottom: 3px; }
  .set-row .lbl small { display: block; color: var(--text-2); font-size: 12px; }
  .set-row input[type="time"] { width: 108px; }
  .set-row input[type="number"] { width: 76px; text-align: center; }
  .set-row input[type="text"] { max-width: 240px; }

  /* Toggle */
  .toggle { position: relative; width: 48px; height: 29px; border-radius: 980px; background: var(--chip); transition: background-color 200ms ease; flex-shrink: 0; }
  .toggle.on { background: var(--good); }
  .toggle .knob {
    position: absolute; top: 2.5px; left: 2.5px; width: 24px; height: 24px;
    border-radius: 50%; background: #fff; box-shadow: var(--thumb-shadow);
    transform: translateX(0); transition: transform 240ms var(--ease-sheet);
  }
  .toggle.on .knob { transform: translateX(19px); }
  .toggle:active .knob { transform: translateX(0) scale(0.94); }
  .toggle.on:active .knob { transform: translateX(19px) scale(0.94); }

  /* Banners & toast */
  .banner {
    border-radius: var(--radius); padding: 11px 16px; font-size: 13px; margin-bottom: 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .banner.info { background: var(--accent-soft); color: var(--accent); }
  .banner.warning { background: var(--warn-soft); color: var(--warn); }
  .toast {
    position: fixed; bottom: 26px; left: 50%; transform: translate(-50%, 14px) scale(0.97);
    background: var(--text); color: var(--bg); border-radius: var(--radius);
    padding: 9px 22px; font-size: 13px; font-weight: 600; z-index: 200;
    box-shadow: var(--shadow); opacity: 0; pointer-events: none;
    max-width: 90vw; text-align: center;
    transition: opacity 300ms ease, transform 300ms var(--ease-out-strong);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .savestate { font-size: 12px; color: var(--text-3); min-width: 60px; text-align: right; }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  .channel-switch { display: inline-flex; align-items: center; min-width: 0; }
  .channel-switch select {
    width: auto; max-width: 168px;
    padding: 6px 28px 6px 10px;
    font-size: 13px; font-weight: 600;
    background: var(--chip);
    border-radius: var(--radius);
  }
  .channel-switch.empty {
    font-size: 12px; font-weight: 600; color: var(--text-2);
    background: var(--chip); border-radius: var(--radius); padding: 6px 10px;
  }
  .bell-wrap { position: relative; }
  .bell-btn { position: relative; }
  .bell-btn svg { display: block; }
  .bell-badge {
    position: absolute; top: -3px; right: -3px;
    min-width: 16px; height: 16px; padding: 0 4px;
    border-radius: 99px; background: var(--accent-fill); color: #fff;
    font-size: 10px; font-weight: 700; line-height: 16px; text-align: center;
    font-family: var(--mono);
  }
  .bell-panel {
    position: absolute; right: 0; top: calc(100% + 8px);
    width: min(360px, calc(100vw - 24px));
    background: var(--card); border: 1px solid var(--sep);
    border-radius: var(--radius-lg); box-shadow: var(--shadow);
    z-index: 80; max-height: min(70vh, 480px); overflow: auto;
  }
  .bell-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 12px 14px; border-bottom: 1px solid var(--sep);
    position: sticky; top: 0; background: var(--card);
  }
  .bell-head strong { font-size: 14px; }
  .bell-empty { padding: 28px 18px; text-align: center; }
  .bell-empty strong { display: block; margin-bottom: 6px; }
  .bell-empty p { margin: 0; color: var(--text-2); font-size: 13px; }
  .notif-row {
    display: block; width: 100%; text-align: left;
    padding: 12px 14px; border-bottom: 1px solid var(--sep);
    border-radius: 0;
  }
  .notif-row:last-child { border-bottom: 0; }
  .notif-row.unread { background: var(--accent-soft); }
  .notif-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .notif-top .when { margin-left: auto; color: var(--text-3); font-size: 11px; font-family: var(--mono); }
  .notif-row b { display: block; font-size: 14px; font-weight: 700; }
  .notif-row .body { color: var(--text-2); font-size: 13px; margin-top: 2px; }
  .jump-target { box-shadow: inset 0 0 0 2px var(--accent-2); border-radius: var(--radius); }

  .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat {
    background: var(--card); border-radius: var(--radius-lg); border: 1px solid var(--sep); box-shadow: var(--shadow); padding: 16px 18px;
  }
  .stat .v { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 12px; color: var(--text-2); font-weight: 500; }

  /* View-change entrance: staggered rise, only when the view actually changes.
     Data mutations re-render without the .enter class, so taps stay instant. */
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .container.enter > * { animation: rise 320ms var(--ease-out-strong) backwards; }
  .container.enter > *:nth-child(2) { animation-delay: 30ms; }
  .container.enter > *:nth-child(3) { animation-delay: 60ms; }
  .container.enter > *:nth-child(4) { animation-delay: 90ms; }
  .container.enter > *:nth-child(5) { animation-delay: 120ms; }
  .container.enter > *:nth-child(6) { animation-delay: 150ms; }

  @keyframes rise-lg { from { opacity: 0; transform: translateY(14px) scale(0.98); } }
  .signin-card { animation: rise-lg 480ms var(--ease-sheet) backwards; }

  /* Hover states only for real pointers — touch taps shouldn't stick */
  @media (hover: hover) and (pointer: fine) {
    .signout:hover { text-decoration: underline; }
    .icon-btn:hover { background: var(--sep); }
    .btn:hover { filter: brightness(1.08); }
    .chip .x:hover { background: var(--bad-soft); color: var(--bad); }
    .addbtn:hover { border-color: var(--accent); color: var(--accent); }
    .pick-row:hover { background: var(--card-2); }
    .notif-row:hover { background: var(--card-2); }
    .cell:hover { border-color: var(--text-3); }
  }

  @media (max-width: 640px) {
    .day-row { grid-template-columns: 1fr; gap: 8px; }
    .shift-row .s-label { width: 100%; }
    .team-add { grid-template-columns: 1fr; }
    .weeknav .wk-label { min-width: 108px; font-size: 13px; }
    .page-title { font-size: 24px; }
    .signin-wrap { padding: 16px 12px; align-items: flex-start; }
    .signin-card { padding: 28px 16px; margin: 8px 0 24px; }
    .secret-box { font-size: 15px; letter-spacing: 0.04em; }

    /* phone ergonomics */
    input, select, textarea { font-size: 16px; }       /* stops iOS zoom-on-focus */
    .container { padding: 18px 14px calc(80px + env(safe-area-inset-bottom)); }
    .card { padding: 16px 14px; border-radius: var(--radius-lg); }
    .topbar-inner { padding: 8px 14px; gap: 10px; }
    .topbar .pill.neutral { display: none; }            /* company chip: reclaim space */
    .channel-switch select { max-width: 112px; padding: 6px 22px 6px 8px; }
    .userbox .uname { max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bell-panel {
      position: fixed; left: 0; right: 0; bottom: 0; top: auto;
      width: auto; max-height: 72vh;
      border-radius: 12px 12px 0 0;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .icon-btn { width: 40px; height: 40px; }            /* 40px+ touch targets */
    .seg button { padding: 9px 15px; }
    .cell { padding: 12px 6px; }
    .chip { padding: 6px 8px 6px 13px; }
    .chip .x { width: 24px; height: 24px; font-size: 12px; }
    .addbtn { padding: 7px 15px; }
    .pick-row { padding: 12px 10px; }
    .mysched-row .d { width: 84px; }
    .ts-name { width: 104px; }
    .stat-cards { grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 8px; }
    .stat { padding: 12px 14px; }
    .stat .v { font-size: 21px; }

    /* submit bar sticks to the bottom of the screen while the grid scrolls */
    .submit-bar {
      position: sticky; bottom: 0; z-index: 40;
      margin: 18px -14px -16px;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      background: var(--bar);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      border-top: 1px solid var(--sep);
      border-radius: 0 0 16px 16px;
    }
    .submit-bar .btn { flex: 1; }
    .submit-note { display: none; }

    /* picker becomes an iOS-style bottom sheet */
    .overlay { align-items: flex-end; padding: 0; }
    .picker {
      max-width: 100%; max-height: 82vh;
      border-radius: 12px 12px 0 0;
      padding-bottom: calc(22px + env(safe-area-inset-bottom));
    }
  }

        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

        count += 1;

        throw count + ' != ' + numChars;
      }

      return unicodeMap;

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {

              bytes.push(b & 0xff);

          }

/* ---------- persistence ---------- */
function loadSession() { try { return JSON.parse(localStorage.getItem(LS_SESSION)); } catch(e){ return null; } }
function saveSession() { try { localStorage.setItem(LS_SESSION, JSON.stringify(ui)); } catch(e){} }

function buildHtml() {
  const json = JSON.stringify(state, null, 1).replace(/</g, "\\u003c");
  return PRISTINE.replace(
    /(<script id="state" type="application\/json">)[\s\S]*?(<\/script>)/,
    (m, a, b) => a + "\n" + json + "\n" + b
  );
}

let saveTimer = null;
let saving = false;
let pendingAdminToggle = null;

function scheduleSave(immediate) {
  try { localStorage.setItem(LS_STATE, JSON.stringify(state)); } catch(e){}
  if (runtime) {
    if (readOnly) return;
    clearTimeout(saveTimer);
    setSaveState("Saving…");
    saveTimer = setTimeout(doPublish, immediate ? 0 : 1400);
  } else if (serverMode) {
    clearTimeout(saveTimer);
    setSaveState("Saving…");
    saveTimer = setTimeout(doServerSave, immediate ? 0 : 1200);
  } else {
    setSaveState("Saved locally");
  }
}

/* ---------- server sync (Railway or any host running server.js) ---------- */
function authHeaders() { return authToken ? { "Authorization": "Bearer " + authToken } : {}; }

function adoptServerState(data) {
  state = ensureReserved(data.state);
  serverVersion = data.version || 0;
  serverMode = true;
  loadedScoped = !!data.scoped;
  loadedChannelId = data.channelId || null;
  if (data.channelId && !ui.channel) ui.channel = data.channelId;
  if (!pollStarted) { pollStarted = true; setInterval(pollServer, 15000); }
}

function forceSignout(msg) {
  authToken = null;
  try { localStorage.removeItem(LS_TOKEN); } catch (e) {}
  ui.email = null; signinStep = null;
  bellOpen = false; channelCatalog = null; notifItems = [];
  loadedScoped = false; loadedChannelId = null; jumpFocus = null;
  saveSession();
  if (msg) toast(msg);
  render();
}

async function loadPublicConfig() {
  try {
    const r = await fetch("api/config", { cache: "no-store" });
    if (!r.ok) return;
    const c = await r.json();
    authMock = !!c.authMock;
  } catch (e) {}
}

async function initServerSync() {
  await loadPublicConfig();
  try { authToken = localStorage.getItem(LS_TOKEN); } catch (e) {}
  try {
    const r = await fetch("api/state", { cache: "no-store", headers: authHeaders() });
    if (r.status === 401) {
      /* a sync server is here but wants authenticator sign-in */
      serverMode = true;
      authToken = null;
      try { localStorage.removeItem(LS_TOKEN); } catch (e) {}
      ui.email = null; saveSession();
      return true;
    }
    if (!r.ok) return false;
    const data = await r.json();
    if (!data || !data.state || !Array.isArray(data.state.employees)) return false;
    adoptServerState(data);
    await alignChannelState();
    return true;
  } catch (e) { return false; }
}

/* AUTH_MOCK=1 can renew a lost session without a code. Real TOTP cannot. */
async function silentRelogin() {
  if (!authMock || !ui.email) return false;
  try {
    const r = await fetch("api/auth/start", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: ui.email }) });
    if (!r.ok) return false;
    const d = await r.json();
    if (d.mode === "mock" && d.token) {
      authToken = d.token;
      try { localStorage.setItem(LS_TOKEN, authToken); } catch (e) {}
      return true;
    }
  } catch (e) {}
  return false;
}

async function pollServer() {
  if (document.hidden || saving || pickerCtx || !authToken) return;
  try {
    const r = await fetch("api/state" + stateQuery(), { cache: "no-store", headers: authHeaders() });
    if (r.status === 401) {
      if (await silentRelogin()) return;
      forceSignout("Your session expired — please sign in again.");
      return;
    }
    if (!r.ok) return;
    const data = await r.json();
    const prev = notifStamp();
    let changed = false;
    if (data.version > serverVersion) {
      adoptServerState(data);
      changed = true;
    }
    await loadNotifications();
    if (changed || notifStamp() !== prev) render();
  } catch (e) {}
}

/* Email, then the 6-digit code from Google Authenticator. */
async function serverSignin(email) {
  try {
    const r = await fetch("api/auth/start", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email }) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      toast(authErrorMessage(data.error) || "Couldn't start sign-in — please try again.");
      return;
    }
    if (data.mode === "mock") {
      authToken = data.token;
      try { localStorage.setItem(LS_TOKEN, authToken); } catch (e) {}
      const sr = await fetch("api/state", { cache: "no-store", headers: authHeaders() });
      if (sr.ok) adoptServerState(await sr.json());
      signinStep = null;
      await alignChannelState();
      signIn(data.email);
      return;
    }
    signinStep = { mode: data.mode, email: data.email || email, secret: data.secret, otpauth: data.otpauth };
    render();
  } catch (e) { toast("Couldn't reach the server — check your connection."); }
}

async function serverVerify() {
  const codeEl = document.getElementById("si-code");
  const code = (codeEl ? codeEl.value : "").replace(/\s+/g, "");
  if (!/^\d{6}$/.test(code)) { toast("Enter the 6-digit code from Google Authenticator."); return; }
  const email = signinStep && signinStep.email;
  try {
    const r = await fetch("api/auth/verify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email, code }) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      toast(authErrorMessage(data.error) || "Sign-in failed — please start again.");
      if (data.error === "no_enrollment" || data.error === "not_on_team" || data.error === "invalid_email") {
        signinStep = null;
        render();
      }
      return;
    }
    authToken = data.token;
    try { localStorage.setItem(LS_TOKEN, authToken); } catch (e) {}
    const sr = await fetch("api/state", { cache: "no-store", headers: authHeaders() });
    if (sr.ok) adoptServerState(await sr.json());
    signinStep = null;
    await alignChannelState();
    signIn(data.email);
  } catch (e) { toast("Couldn't reach the server — check your connection."); }
}

function formatSetupKey(secret) {
  const groups = String(secret || "").replace(/\s+/g, "").toUpperCase().match(/.{1,4}/g) || [];
  const lines = [];
  for (let i = 0; i < groups.length; i += 4) lines.push(groups.slice(i, i + 4).join(" "));
  return lines.join("\n");
}

function drawEnrollQr() {
  const box = document.getElementById("qr-box");
  if (!box || !signinStep || signinStep.mode !== "enroll" || !signinStep.otpauth || typeof qrcode !== "function") return;
  try {
    const qr = qrcode(0, "M");
    qr.addData(signinStep.otpauth);
    qr.make();
    box.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  } catch (e) { box.style.display = "none"; }
}

async function copySetupKey() {
  const secret = signinStep && String(signinStep.secret || "").replace(/\s+/g, "");
  if (!secret) return;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(secret);
      toast("Setup key copied.");
      return;
    }
  } catch (e) {}
  const el = document.getElementById("setup-key");
  if (el && document.createRange && window.getSelection) {
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
  toast("Select the setup key and copy it. Spaces don't matter.");
}

async function restartEnroll() {
  const email = signinStep && signinStep.email;
  if (!email) return;
  try {
    const r = await fetch("api/auth/start", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, reenroll: true })
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok || data.mode !== "enroll" || !data.secret) {
      toast(authErrorMessage(data.error) || "Couldn't start setup again.");
      return;
    }
    signinStep = { mode: "enroll", email: data.email || email, secret: data.secret, otpauth: data.otpauth };

}

async function resetTotp(email) {
  try {
    const r = await fetch("api/auth/reset", { method: "POST", headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()), body: JSON.stringify({ email }) });
    if (r.ok) toast("Authenticator reset — they'll enter a new setup key in Google Authenticator next time.");
    else {
      const data = await r.json().catch(() => ({}));

function adminBits(list) {
  return (list || []).map(e => (e && e.email) + (e && e.admin ? "1" : "0")).join("\n");
}
function undoAdminToggle(adminToggle) {
  if (!adminToggle) return;
  const emp = findEmp(adminToggle.email);
  if (emp) emp.admin = !adminToggle.admin;
  render();
}
async function doServerSave(isRetry) {
  if (saving) return;
  saving = true;
  const adminToggle = pendingAdminToggle;
  pendingAdminToggle = null;
  try {
    const payload = { version: serverVersion, state };
    if (adminToggle) payload.adminToggle = adminToggle;
    const r = await fetch("api/state" + stateQuery(), {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
      body: JSON.stringify(payload)
    });
    if (r.status === 401) {
      saving = false;
      if (!isRetry && await silentRelogin()) {
        /* server restarted mid-session: refresh the version, then save once more */
        pendingAdminToggle = adminToggle;
        try {
          const sr = await fetch("api/state" + stateQuery(), { cache: "no-store", headers: authHeaders() });
          if (sr.ok) {
            const fresh = await sr.json();
            serverVersion = fresh.version || 0;
            if (fresh.state) state = ensureReserved(fresh.state);
          }
        } catch (e) {}
        return doServerSave(true);
      }
      forceSignout("Your session expired — please sign in again.");
      return;
    } else if (r.status === 409) {
      const data = await r.json();
      adoptServerState(data);
      setSaveState("");
      toast("Someone saved just before you — showing the latest. Please redo your change.");
      render();
    } else if (r.ok) {
      const data = await r.json();
      serverVersion = data.version;
      if (Array.isArray(data.employees) && adminBits(data.employees) !== adminBits(state.employees)) {
        state.employees = data.employees;
        render();
      }
      setSaveState("Saved ✓");
      setTimeout(() => setSaveState(""), 2000);
    } else {
      const data = await r.json().catch(() => ({}));
      undoAdminToggle(adminToggle);
      setSaveState("Not saved");
      toast(authErrorMessage(data.error) || "Couldn't save — please try again.");
    }
  } catch (e) {
    undoAdminToggle(adminToggle);
    setSaveState("Not saved");
    toast("Couldn't reach the server — check your connection.");
  }
  saving = false;
  if (pendingAdminToggle) scheduleSave(true);
}

async function doPublish() {
  if (!runtime || saving) return;
  saving = true;
  try {
    await runtime.publish(buildHtml());
    /* on success the page reloads to the new version */
  } catch (err) {
    saving = false;
    const code = err && err.code;
    if (code === "not_granted" || code === "not_writer") {
      readOnly = true;
      setSaveState("");
      toast("View-only access — changes can't be saved. Ask the owner for edit access.");
      render();
    } else if (code === "conflict") {
      /* another view published first; the runtime reloads us to the winner */
      setSaveState("");
    } else {
      setSaveState("Not saved");
      toast("Couldn't save — please try again.");
    }
  }
}

function setSaveState(txt) {

  if (el) el.textContent = txt;
}

function signIn(email) {

  ui.email = emp.email;
  ui.tab = emp.admin ? "availability" : "submit";

  return true;
}
function approvePending(id) {
  const emp = empById(id); if (!emp) return;
  delete emp.pending;
  toast(emp.name + " approved — they can sign in now.");
  scheduleSave(true); render();
}
function signOut() {
  if (serverMode) { authToken = null; try { localStorage.removeItem(LS_TOKEN); } catch (e) {} }
  ui.email = null; signinStep = null;
  bellOpen = false; channelCatalog = null; notifItems = [];
  loadedScoped = false; loadedChannelId = null; jumpFocus = null;

}

function cycleCell(dayIdx, shiftId) {
  const me = currentUser(); if (!me) return;
  const wk = getWeek(ui.week);
  if (isLocked(ui.week)) { toast("Submissions for this week are closed."); return; }
  const sub = wk.submissions[me.id] || (wk.submissions[me.id] = { cells:{}, note:"", submittedAt:null });
  const key = dayIdx + "." + shiftId;
  const order = [undefined, "yes", "pref", "no"];
  const cur = sub.cells[key];
  const next = order[(order.indexOf(cur) + 1) % order.length];
  if (next === undefined) delete sub.cells[key]; else sub.cells[key] = next;
  render(); /* redraw immediately; publish happens on Submit */
}

function submitAvailability() {
  const me = currentUser(); if (!me) return;
  const wk = getWeek(ui.week);
  if (isLocked(ui.week)) { toast("Submissions for this week are closed."); return; }
  const sub = wk.submissions[me.id] || (wk.submissions[me.id] = { cells:{}, note:"", submittedAt:null });
  const noteEl = document.getElementById("worker-note");
  if (noteEl) sub.note = noteEl.value.trim();
  sub.submittedAt = new Date().toISOString();
  toast((runtime || serverMode) ? "Availability submitted ✓" : "Availability saved (preview mode)");
  scheduleSave(true);
  render();
}

function toggleAssign(dayIdx, shiftId, empId) {
  const wk = getWeek(ui.week);
  const key = dayIdx + "." + shiftId;
  const list = wk.assignments[key] || (wk.assignments[key] = []);
  const i = list.indexOf(empId);
  if (i >= 0) list.splice(i, 1); else list.push(empId);
  if (!list.length) delete wk.assignments[key];
  pickerCtx = null;
  scheduleSave(false);
  render();
}

function autoFill() {
  const wk = getWeek(ui.week);
  const totals = {};
  employeesInView().forEach(e => totals[e.id] = 0);
  Object.values(wk.assignments).forEach(l => l.forEach(id => totals[id] = (totals[id]||0)+1));
  for (let d = 0; d < 7; d++) {
    for (const sh of state.settings.shifts) {
      const key = d + "." + sh.id;
      const need = state.settings.required[sh.id] || 0;
      const list = wk.assignments[key] || (wk.assignments[key] = []);
      const busyToday = new Set();
      state.settings.shifts.forEach(s2 => (wk.assignments[d + "." + s2.id] || []).forEach(id => busyToday.add(id)));
      const rank = { pref: 0, yes: 1 };
      const cands = employeesInView()
        .filter(e => !e.pending)
        .filter(e => !e.admin || wk.submissions[e.id])
        .filter(e => !list.includes(e.id) && !busyToday.has(e.id))
        .map(e => ({ e, av: (wk.submissions[e.id] || {cells:{}}).cells[key] }))
        .filter(c => c.av === "yes" || c.av === "pref")
        .sort((a,b) => (rank[a.av] - rank[b.av]) || (totals[a.e.id] - totals[b.e.id]));
      while (list.length < need && cands.length) {
        const c = cands.shift();
        list.push(c.e.id); busyToday.add(c.e.id); totals[c.e.id]++;
      }
      if (!list.length) delete wk.assignments[key];
    }
  }
  toast("Auto-fill complete — review and adjust, then publish.");
  scheduleSave(false);
  render();
}

function clearWeek() {
  const wk = getWeek(ui.week);
  wk.assignments = {}; wk.published = false;
  scheduleSave(false); render();
}

function publishSchedule() {
  const wk = getWeek(ui.week);
  wk.published = !wk.published;
  toast(wk.published ? "Schedule published — workers can now see their shifts." : "Schedule unpublished.");
  scheduleSave(true); render();
}

function toggleLock() {
  const wk = getWeek(ui.week);
  if (isLocked(ui.week)) {
    wk.locked = false;
    wk.lockOverride = "open";  /* override the Monday 10:00 auto-lock for this week */
    toast("Submissions reopened for this week (auto-lock overridden).");
  } else {
    wk.locked = true;
    delete wk.lockOverride;
    toast("Submissions closed for this week.");
  }
  scheduleSave(false); render();
}

function addEmployee(name, email) {
  const cleanName = String(name || "").trim();
  const cleanEmail = String(email || "").trim().toLowerCase();
  if (!cleanName || !rosterEmailOk(cleanEmail)) {
    toast("Use a full name and a firstname.lastname@cybereason.com email.");
    return;
  }
  if (findEmp(cleanEmail)) { toast("That email is already on the team."); return; }
  const id = "e" + Math.random().toString(36).slice(2, 8);
  state.employees.push({ id, name: cleanName, email: cleanEmail, admin: false, position: "Shift worker" });
  scheduleSave(false); render();
}
function removeEmployee(id) {
  const emp = empById(id); if (!emp) return;
  if (emp.admin && state.employees.filter(e => e.admin).length === 1) { toast("You can't remove the only admin."); return; }
  state.employees = state.employees.filter(e => e.id !== id);
  Object.values(state.weeks).forEach(wk => {
    delete wk.submissions[id];
    Object.keys(wk.assignments).forEach(k => {
      wk.assignments[k] = wk.assignments[k].filter(x => x !== id);
      if (!wk.assignments[k].length) delete wk.assignments[k];
    });
  });
  scheduleSave(false); render();
}
function toggleAdmin(id) {
  const emp = empById(id); if (!emp) return;
  const me = currentUser();
  if (emp.admin && emp.email === "nir.itzik@cybereason.com") {
    toast("Nir Itzik stays an admin.");
    return;
  }
  if (emp.admin && me && emp.email === me.email) {
    toast("You can't remove your own admin access. Ask another admin.");
    return;
  }
  if (emp.admin && state.employees.filter(e => e.admin).length === 1) { toast("At least one admin is required."); return; }
  emp.admin = !emp.admin;
  pendingAdminToggle = { email: emp.email, admin: !!emp.admin };
  scheduleSave(false); render();
}

function updateShiftTime(shiftId, field, value) {
  const sh = state.settings.shifts.find(s => s.id === shiftId);
  if (sh && value) { sh[field] = value; scheduleSave(false); }
}
function updateRequired(shiftId, value) {
  const n = Math.max(0, Math.min(20, parseInt(value, 10) || 0));
  state.settings.required[shiftId] = n;
  scheduleSave(false); render();
}
function updateCompany(v) { state.settings.company = v.trim() || "My Company"; scheduleSave(false); }

async function exportCsv() {
  const wk = getWeek(ui.week);
  const rows = [["Date","Day","Shift","Hours","Assigned"]];
  for (let d = 0; d < 7; d++) {
    for (const sh of state.settings.shifts) {
      const names = (wk.assignments[d + "." + sh.id] || []).map(id => (empById(id)||{name:"?"}).name).join("; ");
      rows.push([fmtKey(dayDate(ui.week, d)), DAY_NAMES[d], sh.name, sh.start + "–" + sh.end, names]);
    }
  }
  const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(",")).join("\r\n");
  if (downloadsCap) {
    try { await downloadsCap.save({ filename: "schedule-" + ui.week + ".csv", data: csv }); }
    catch(e) { /* viewer declined */ }
  } else {
    toast("Export is available in the published app.");
  }
}

/* ---------- rendering ---------- */
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

let pickerCtx = null;        /* {dayIdx, shiftId} when picker open */
let lastViewKey = "";        /* stagger entrance only on real view changes */

function render() {
  const app = document.getElementById("app");
  const me = currentUser();
  if (!me) { lastViewKey = "signin"; app.innerHTML = renderSignin(); drawEnrollQr(); return; }
  if (!serverMode) ensureLocalChrome();
  if (!ui.week) ui.week = nextWeekKey();
  const closed = !!(serverMode && channelCatalog && channelCatalog.length === 0);
  const viewKey = me.id + "|" + (closed ? "closed" : ui.tab) + "|" + ui.week + "|" + (ui.channel || "");
  const entered = viewKey !== lastViewKey;
  lastViewKey = viewKey;

  const banner = (localOnly && !runtime && !serverMode)
    ? '<div class="banner warning">⚠︎ Preview mode — changes are saved only in this browser. Open the team app for shared saving.</div>'
    : (readOnly ? '<div class="banner warning">⚠︎ You have view-only access, so changes can\'t be saved. Ask the owner to share edit access.</div>' : "");

  app.innerHTML =
    renderTopbar(me) +
    '<div class="container' + (entered ? " enter" : "") + '">' + banner +
    (closed ? renderClosedTeam() : (me.admin ? renderAdmin(me) : renderWorker(me))) +
    "</div>" +
    (pickerCtx ? renderPicker() : "");

  const note = document.getElementById("worker-note");
  if (note) note.addEventListener("keydown", e => e.stopPropagation());
  scrollToFocus();
}

function onSignin(ev) {
  ev.preventDefault();
  const email = document.getElementById("si-email").value.trim().toLowerCase();
  if (!rosterEmailOk(email)) {
    toast(authErrorMessage("invalid_email"));
    return false;
  }
  if (serverMode) { serverSignin(email); return false; }
  const emp = findEmp(email);
  if (!emp || emp.pending) {
    toast(emp && emp.pending
      ? "This email isn't active yet. Ask an admin to add you."
      : authErrorMessage("not_on_team"));
    return false;
  }
  signIn(email);
  return false;
}

/* ===================== WORKER ===================== */
function renderWorker(me) {
  const tabs = [["submit","Submit availability"],["mysched","Schedule"]];
  if (!tabs.some(t => t[0] === ui.tab)) ui.tab = "submit";
  let html =
    '<div style="display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px">' +
      '<div><h1 class="page-title">Hi, ' + esc(me.name.split(" ")[0]) + '</h1>' +
      '<p class="page-sub">Week of ' + weekLabel(ui.week) + "</p></div>" +
      renderWeeknav() +
    "</div>" +
    '<div class="seg">' + tabs.map(t =>
      '<button class="' + (ui.tab === t[0] ? "on" : "") + '" onclick="setTab(\'' + t[0] + '\')">' + t[1] + "</button>"
    ).join("") + "</div>";
  html += ui.tab === "submit" ? renderWorkerSubmit(me) : renderWorkerSchedule(me);
  return html;
}

function renderWorkerSubmit(me) {
  const wk = getWeek(ui.week);
  const sub = wk.submissions[me.id] || { cells:{}, note:"", submittedAt:null };
  const shifts = state.settings.shifts;

  let grid = '<div class="avail-grid">';
  for (let d = 0; d < 7; d++) {
    const date = dayDate(ui.week, d);
    grid += '<div class="day-row"><div><span class="day-name">' + DAY_NAMES[d] + '</span><br>' +
      '<span class="day-date">' + fmtShort(date) + "</span></div>" +
      '<div class="shift-cells">' +
      shifts.map(sh => {
        const st = sub.cells[d + "." + sh.id];
        const label = st === "yes" ? "Available" : st === "pref" ? "★ Preferred" : st === "no" ? "Can't work" : "Tap to set";
        return '<button class="cell ' + (st || "") + '" onclick="cycleCell(' + d + ',\'' + sh.id + '\')" ' +
          'aria-label="' + DAY_NAMES[d] + " " + esc(sh.name) + ": " + label + '">' +
          '<span class="c-name shift-pill ' + esc(sh.id) + '">' + esc(sh.name) + '</span>' +
          '<span class="c-state">' + label + "</span></button>";
      }).join("") +
      "</div></div>";
  }
  grid += "</div>";

  const locked = isLocked(ui.week);
  const lockedBanner = locked
    ? '<div class="banner info">🔒 Submissions for this week closed ' + fmtDeadline(ui.week) + ". Contact your manager to make changes.</div>"
    : '<div class="banner info">⏰ Submissions close ' + fmtDeadline(ui.week) + ".</div>";
  const submittedPill = sub.submittedAt
    ? '<span class="pill good">✓ Submitted ' + new Date(sub.submittedAt).toLocaleDateString("en-GB",{day:"numeric",month:"short"}) + "</span>"
    : '<span class="pill warn">Not submitted yet</span>';

  return '<div class="card">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px">' +
      "<div><h3>Your availability</h3>" +
      '<p class="sub" style="margin:0">Tap a shift to cycle: available → preferred → can\'t work → clear</p></div>' +
      submittedPill +
    "</div>" +
    lockedBanner + grid +
    '<div class="legend">' +
      '<span><span class="dot d-yes"></span>Available</span>' +
      '<span><span class="dot d-pref"></span>Preferred</span>' +
      '<span><span class="dot d-no"></span>Can\'t work</span>' +
      '<span><span class="dot d-unset"></span>Not set</span>' +
    "</div>" +
    '<div style="margin-top:16px"><label style="font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em">Note to your manager (optional)</label>' +
    '<textarea id="worker-note" rows="2" style="margin-top:6px" placeholder="e.g. I can cover extra shifts this week"' + (locked ? " disabled" : "") + ">" + esc(sub.note || "") + "</textarea></div>" +
    '<div class="submit-bar">' +
      '<button class="btn" onclick="submitAvailability()"' + (locked ? " disabled" : "") + ">" + (sub.submittedAt ? "Update submission" : "Submit availability") + "</button>" +
      '<span class="submit-note">Your manager sees your submission the moment you send it.</span>' +
    "</div></div>";
}

function renderWorkerSchedule(me) {
  const wk = getWeek(ui.week);
  if (!wk.published) {
    return '<div class="card" style="text-align:center;padding:44px 20px">' +
      '<div style="font-size:34px;margin-bottom:8px">🗓️</div>' +
      "<h3>Schedule not published yet</h3>" +
      '<p class="sub" style="margin:4px 0 0">Your manager is still working on this week. Use the ‹ › arrows above to check another week.</p></div>';
  }
  let rows = "";
  let myShifts = 0;
  for (let d = 0; d < 7; d++) {
    const date = dayDate(ui.week, d);
    const mine = state.settings.shifts.filter(sh => (wk.assignments[d + "." + sh.id] || []).includes(me.id));
    myShifts += mine.length;
    rows += '<div class="mysched-row"><div class="d">' + DAY_SHORT[d] + "<small>" + fmtShort(date) + "</small></div>" +
      (mine.length
        ? mine.map(sh => '<span id="' + shiftDomId(d, sh.id) + '" class="shift-badge ' + esc(sh.id) + jumpClass(d, sh.id) + '"><b>' + esc(sh.name) + "</b><small>" + sh.start + "–" + sh.end + "</small></span>").join("")
        : '<span class="off">Day off</span>') +
      "</div>";
  }

  /* full team schedule for the week — everyone can see who works when */
  let teamDays = "";
  for (let d = 0; d < 7; d++) {
    const date = dayDate(ui.week, d);
    let shiftRows = "";
    for (const sh of state.settings.shifts) {
      const list = wk.assignments[d + "." + sh.id] || [];
      if (!list.length) continue;
      shiftRows += '<div id="team-' + shiftDomId(d, sh.id) + '" class="team-shift-row' + jumpClass(d, sh.id) + '">' +
        '<span class="ts-name"><span class="shift-pill ' + esc(sh.id) + '">' + esc(sh.name) + "</span> <small>" + sh.start + "–" + sh.end + "</small></span>" +
        '<span class="ts-people">' + list.map(id => {
          const emp = empById(id); if (!emp) return "";
          return '<span class="ts-chip' + (id === me.id ? " me" : "") + '">' + esc(emp.name) + "</span>";
        }).join("") + "</span></div>";
    }
    teamDays += '<div class="team-day"><div class="td-head">' + DAY_NAMES[d] + " <small>" + fmtShort(date) + "</small></div>" +
      (shiftRows || '<div class="off" style="padding:2px 0 6px">No shifts scheduled</div>') + "</div>";
  }

  return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px">' +
    "<h3>Your shifts this week</h3>" +
    '<span class="pill accent">' + myShifts + " shift" + (myShifts === 1 ? "" : "s") + "</span></div>" +
    '<div class="mysched">' + rows + "</div></div>" +
    '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">' +
    "<div><h3>Full team schedule</h3>" +
    '<p class="sub">Everyone\'s shifts for the week of ' + weekLabel(ui.week) + " — you're highlighted.</p></div>" +
    '<span class="pill good">Published</span></div>' +
    teamDays + "</div>";
}

/* ===================== ADMIN ===================== */
function renderAdmin(me) {
  const tabs = [
    ["availability","Availability"],
    ["submit","My availability"],
    ["schedule","Schedule"],
    ["team","Team"],
    ["settings","Settings"]
  ];
  if (!tabs.some(t => t[0] === ui.tab)) ui.tab = "availability";
  let html =
    '<div style="display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px">' +
      '<div><h1 class="page-title">Dashboard</h1>' +
      '<p class="page-sub">Week of ' + weekLabel(ui.week) + "</p></div>" +
      renderWeeknav() +
    "</div>" +
    '<div class="seg">' + tabs.map(t =>
      '<button class="' + (ui.tab === t[0] ? "on" : "") + '" onclick="setTab(\'' + t[0] + '\')">' + t[1] + "</button>"

function renderAdminAvailability() {
  const wk = getWeek(ui.week);
  const workers = employeesInView().filter(e => !e.pending);
  const submitted = workers.filter(w => wk.submissions[w.id] && wk.submissions[w.id].submittedAt);
  const shifts = state.settings.shifts;

  let stats =
    '<div class="stat-cards">' +
      '<div class="stat"><div class="v">' + submitted.length + " / " + workers.length + '</div><div class="k">Team submitted</div></div>' +
      '<div class="stat"><div class="v">' + (wk.published ? "Live" : "Draft") + '</div><div class="k">Schedule status</div></div>' +
      '<div class="stat"><div class="v">' + (isLocked(ui.week) ? "Closed" : "Open") + '</div><div class="k">Submissions</div></div>' +
    "</div>";

  let head = "<tr><th>Worker</th>" +
    Array.from({length:7}, (_, d) => "<th>" + DAY_SHORT[d] + "<small>" + fmtShort(dayDate(ui.week, d)) + "</small></th>").join("") +
    "</tr>";

  let body = workers.map(w => {
    const sub = wk.submissions[w.id];
    const status = sub && sub.submittedAt
      ? '<span class="pill good" style="font-size:10px;padding:2px 8px">✓</span>'
      : '<span class="pill neutral" style="font-size:10px;padding:2px 8px">–</span>';
    let cells = "";
    for (let d = 0; d < 7; d++) {
      cells += '<td><div class="mini-cells">' + shifts.map(sh => {
        const st = sub ? sub.cells[d + "." + sh.id] : undefined;
        return '<span class="mini ' + esc(sh.id) + (st ? " " + st : "") + '" title="' + esc(sh.name) + '">' + esc(sh.name[0]) + "</span>";
      }).join("") + "</div></td>";
    }
    const note = sub && sub.note ? '<div class="st" title="' + esc(sub.note) + '">💬 ' + esc(sub.note.length > 34 ? sub.note.slice(0,34) + "…" : sub.note) + "</div>" : "";
    return "<tr><td><div class=\"emp-cell\">" +
      '<span class="avatar" style="width:26px;height:26px;font-size:10px">' + esc(initials(w.name)) + "</span>" +
      '<div><div class="nm">' + esc(w.name) +
        (w.admin ? ' <span class="pill accent" style="font-size:10px;padding:2px 8px">Admin</span>' : "") +
        " " + status + "</div>" + note + "</div></div></td>" + cells + "</tr>";
  }).join("");

  if (!workers.length) body = '<tr><td colspan="8" style="color:var(--text-2)">No workers yet — add your team in the Team tab.</td></tr>';

  return stats +
    '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">' +
      "<div><h3>Availability submissions</h3>" +
      '<p class="sub">Each cell shows ' + shifts.map(s => esc(s.name[0]) + " = " + esc(s.name)).join(", ") + "</p></div>" +
      '<button class="btn secondary small" onclick="toggleLock()">' + (isLocked(ui.week) ? "Reopen submissions" : "Close submissions") + "</button>" +
    "</div>" +
    '<div class="matrix-wrap"><table class="matrix"><thead>' + head + "</thead><tbody>" + body + "</tbody></table></div>" +
    '<div class="legend">' +
      '<span><span class="dot d-yes"></span>Available</span>' +
      '<span><span class="dot d-pref"></span>Preferred</span>' +
      '<span><span class="dot d-no"></span>Can\'t work</span>' +
      '<span><span class="dot d-unset"></span>No response</span>' +
    "</div></div>";
}

function renderAdminSchedule() {
  const wk = getWeek(ui.week);
  const shifts = state.settings.shifts;
  let totalAssigned = 0, totalNeeded = 0;

  let days = "";
  for (let d = 0; d < 7; d++) {
    const date = dayDate(ui.week, d);
    let rows = "";
    for (const sh of shifts) {
      const key = d + "." + sh.id;
      const need = state.settings.required[sh.id] || 0;
      const list = wk.assignments[key] || [];
      totalAssigned += list.length; totalNeeded += need;
      const busy = {};
      shifts.forEach(s2 => (wk.assignments[d + "." + s2.id] || []).forEach(id => busy[id] = (busy[id]||0)+1));
      const chips = list.map(id => {
        const emp = empById(id); if (!emp) return "";
        const av = (wk.submissions[id] || {cells:{}}).cells[key];
        const problem = av === "no" ? "Marked can't work" : (!av ? "No response" : (busy[id] > 1 ? "Double-booked today" : null));
        return '<span class="chip' + (problem ? " warnchip" : "") + '"' + (problem ? ' title="' + esc(problem) + '"' : "") + ">" +
          (problem ? "⚠︎ " : (av === "pref" ? "★ " : "")) + esc(emp.name) +
          '<button class="x" aria-label="Remove ' + esc(emp.name) + '" onclick="toggleAssign(' + d + ',\'' + sh.id + '\',\'' + id + '\')">✕</button></span>';
      }).join("");
      const countCls = list.length >= need ? "good" : (list.length ? "warn" : "neutral");
      rows += '<div id="' + shiftDomId(d, sh.id) + '" class="shift-row' + jumpClass(d, sh.id) + '">' +
        '<div class="s-label"><span class="shift-pill ' + esc(sh.id) + '">' + esc(sh.name) + "</span><small>" + sh.start + "–" + sh.end + "</small></div>" +
        '<span class="pill ' + countCls + ' count">' + list.length + " / " + need + "</span>" +
        '<div class="assigned">' + chips +
          '<button class="addbtn" onclick="openPicker(' + d + ',\'' + sh.id + '\')">+ Assign</button>' +
        "</div></div>";
    }
    days += '<div class="sched-day"><div class="sched-day-head"><h4>' + DAY_NAMES[d] + "</h4><small>" + fmtShort(date) + "</small></div>" + rows + "</div>";
  }

  const coverage = totalNeeded ? Math.round(100 * Math.min(totalAssigned, totalNeeded) / totalNeeded) : 0;

  return '<div class="stat-cards">' +
      '<div class="stat"><div class="v">' + coverage + '%</div><div class="k">Coverage vs. required</div></div>' +
      '<div class="stat"><div class="v">' + totalAssigned + '</div><div class="k">Shifts assigned</div></div>' +
      '<div class="stat"><div class="v">' + (wk.published ? "Live" : "Draft") + '</div><div class="k">Schedule status</div></div>' +
    "</div>" +
    '<div class="card">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">' +
      "<div><h3>Build the schedule</h3>" +
      '<p class="sub" style="margin:0">Auto-fill respects availability and balances shifts; ★ marks preferred, ⚠︎ marks conflicts.</p></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn secondary small" onclick="autoFill()">✦ Auto-fill</button>' +
        '<button class="btn secondary small" onclick="exportCsv()">Export CSV</button>' +
        '<button class="btn danger small" onclick="clearWeek()">Clear</button>' +
        '<button class="btn small" onclick="publishSchedule()">' + (wk.published ? "Unpublish" : "Publish schedule") + "</button>" +
      "</div>" +
    "</div>" + days + "</div>";
}

function openPicker(dayIdx, shiftId) { bellOpen = false; pickerCtx = { dayIdx, shiftId }; render(); }
function closePicker() { pickerCtx = null; render(); }

function renderPicker() {
  const { dayIdx, shiftId } = pickerCtx;
  const wk = getWeek(ui.week);
  const sh = state.settings.shifts.find(s => s.id === shiftId);
  const key = dayIdx + "." + shiftId;
  const assigned = new Set(wk.assignments[key] || []);
  const busy = new Set();
  state.settings.shifts.forEach(s2 => (wk.assignments[dayIdx + "." + s2.id] || []).forEach(id => busy.add(id)));

  const groups = { pref: [], yes: [], unset: [], no: [] };
  employeesInView().filter(e => !assigned.has(e.id) && !e.pending).forEach(e => {
    const av = (wk.submissions[e.id] || {cells:{}}).cells[key];
    groups[av === "pref" ? "pref" : av === "yes" ? "yes" : av === "no" ? "no" : "unset"].push(e);
  });

  const totals = {};
  Object.values(wk.assignments).forEach(l => l.forEach(id => totals[id] = (totals[id]||0)+1));

  function rows(list) {
    return list.map(e =>
      '<button class="pick-row" onclick="toggleAssign(' + dayIdx + ',\'' + shiftId + '\',\'' + e.id + '\')">' +
        '<span class="avatar" style="width:26px;height:26px;font-size:10px">' + esc(initials(e.name)) + "</span>" +
        '<span class="nm">' + esc(e.name) + (busy.has(e.id) ? ' <span class="pill warn" style="font-size:10px;padding:1px 7px">on shift today</span>' : "") + "</span>" +
        '<span class="meta">' + (totals[e.id] || 0) + " this week</span>" +
      "</button>"
    ).join("");
  }
  const sections = [
    ["pref", "★ Preferred"], ["yes", "Available"], ["unset", "No response"], ["no", "Marked can't work"]
  ].filter(([k]) => groups[k].length).map(([k, label]) =>
    '<div class="pick-group g-' + k + '"><div class="g-label">' + label + "</div>" + rows(groups[k]) + "</div>"
  ).join("") || '<p class="sub">Everyone is already assigned to this shift.</p>';

  return '<div class="overlay" onclick="if(event.target===this)closePicker()"><div class="picker" role="dialog" aria-modal="true">' +
    '<h4>Assign <span class="shift-pill ' + esc(sh.id) + '">' + esc(sh.name) + "</span></h4>" +
    '<p class="sub">' + DAY_NAMES[dayIdx] + " " + fmtShort(dayDate(ui.week, dayIdx)) + " · " + sh.start + "–" + sh.end + "</p>" +
    sections +
    '<button class="btn secondary picker-close" onclick="closePicker()">Done</button>' +
  "</div></div>";
}

function renderAdminTeam() {
  const rows = employeesInView().filter(e => !e.pending).map(e =>
    '<div class="team-row">' +
      '<span class="avatar">' + esc(initials(e.name)) + "</span>" +
      '<div class="info"><b>' + esc(e.name) + (e.admin ? ' <span class="pill accent" style="font-size:10px;padding:2px 8px">Admin</span>' : "") + "</b>" +
      "<small>" + esc(e.email) + "</small></div>" +
      '<button class="btn secondary small" onclick="toggleAdmin(\'' + e.id + '\')">' + (e.admin ? "Make worker" : "Make admin") + "</button>" +
      (serverMode ? '<button class="btn secondary small" onclick="resetTotp(\'' + esc(e.email) + '\')">Reset 2FA</button>' : "") +
      '<button class="btn danger small" onclick="removeEmployee(\'' + e.id + '\')">Remove</button>' +
    "</div>"
  ).join("");
  const pendingEmps = employeesInView().filter(e => e.pending);
  const pendingRows = pendingEmps.map(e =>
    '<div class="team-row">' +
      '<span class="avatar">' + esc(initials(e.name)) + "</span>" +
      '<div class="info"><b>' + esc(e.name) + "</b><small>" + esc(e.email) + "</small></div>" +
      '<button class="btn small" onclick="approvePending(\'' + e.id + '\')">Approve</button>' +
      '<button class="btn danger small" onclick="removeEmployee(\'' + e.id + '\')">Remove</button>' +
    "</div>"
  ).join("");
  const pendingCard = pendingEmps.length
    ? '<div class="card"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><h3 style="margin:0">Not active yet</h3>' +
      '<span class="pill warn">' + pendingEmps.length + "</span></div>" +
      '<p class="sub">These people are on the list but can\'t sign in until you approve them. New people don\'t request access — add them below.</p>' +
      pendingRows + "</div>"
    : "";
  return pendingCard + '<div class="card"><h3>Team</h3>' +
    '<p class="sub">Only firstname.lastname@cybereason.com addresses on this list can sign in. Admins add and remove people here.</p>' +
    rows +
    '<div class="team-add">' +
      '<input id="add-name" placeholder="Full name" aria-label="New team member name">' +
      '<input id="add-email" type="email" placeholder="firstname.lastname@cybereason.com" aria-label="New team member email">' +
      '<button class="btn" onclick="addEmployee(document.getElementById(\'add-name\').value, document.getElementById(\'add-email\').value)">Add</button>' +
    "</div></div>";
}

function renderAdminSettings() {
  const wk = getWeek(ui.week);
  const shiftRows = state.settings.shifts.map(sh =>
    '<div class="set-row">' +
      '<div class="lbl"><span class="shift-pill ' + esc(sh.id) + '">' + esc(sh.name) + '</span><small>Start / end time</small></div>' +
      '<input type="time" value="' + sh.start + '" onchange="updateShiftTime(\'' + sh.id + '\',\'start\',this.value)" aria-label="' + esc(sh.name) + ' start">' +
      '<input type="time" value="' + sh.end + '" onchange="updateShiftTime(\'' + sh.id + '\',\'end\',this.value)" aria-label="' + esc(sh.name) + ' end">' +
    "</div>"
  ).join("");
  const reqRows = state.settings.shifts.map(sh =>
    '<div class="set-row">' +
      '<div class="lbl"><span class="shift-pill ' + esc(sh.id) + '">' + esc(sh.name) + '</span><small>Workers needed per day</small></div>' +
      '<input type="number" min="0" max="20" value="' + (state.settings.required[sh.id] || 0) + '" onchange="updateRequired(\'' + sh.id + '\',this.value)" aria-label="Required for ' + esc(sh.name) + '">' +
    "</div>"
  ).join("");
  return '<div class="card"><h3>Company</h3>' +
      '<div class="set-row"><div class="lbl"><b>Company name</b><small>Shown on the sign-in screen</small></div>' +
      '<input type="text" value="' + esc(state.settings.company) + '" onchange="updateCompany(this.value)" aria-label="Company name"></div></div>' +
    '<div class="card"><h3>Shift hours</h3><p class="sub">Applies to every week.</p>' + shiftRows + "</div>" +
    '<div class="card"><h3>Staffing requirements</h3><p class="sub">The schedule builder and auto-fill aim for these numbers.</p>' + reqRows + "</div>" +
    '<div class="card"><h3>This week (' + weekLabel(ui.week) + ")</h3>" +
      '<div class="set-row"><div class="lbl"><b>Accept submissions</b><small>Locks automatically every Monday at 10:00 (this week: ' + fmtDeadline(ui.week) + "). This switch overrides it for the selected week.</small></div>" +
      '<button class="toggle ' + (isLocked(ui.week) ? "" : "on") + '" role="switch" aria-checked="' + (!isLocked(ui.week)) + '" aria-label="Accept submissions" onclick="toggleLock()"><span class="knob"></span></button></div>' +
      '<div class="set-row"><div class="lbl"><b>Schedule published</b><small>Workers can see their assigned shifts</small></div>' +
      '<button class="toggle ' + (wk.published ? "on" : "") + '" role="switch" aria-checked="' + (!!wk.published) + '" aria-label="Schedule published" onclick="publishSchedule()"><span class="knob"></span></button></div>' +
    "</div>";
}

/* re-render when the Monday 10:00 auto-lock flips while the page is open */
let renderedLockState = null;
setInterval(() => {
  if (!currentUser() || pickerCtx || !ui.week) return;
  const l = isLocked(ui.week);
  if (renderedLockState !== null && l !== renderedLockState) render();
  renderedLockState = l;
}, 30000);

document.addEventListener("click", () => {
  if (!bellOpen) return;
  bellOpen = false;
  render();
});

/* ---------- boot ---------- */
(async function boot() {
  ensureReserved(state);
  render();
  try {
    if (window.claude && typeof window.claude.use === "function") {
      const [art, dl] = await Promise.all([claude.use("artifact"), claude.use("downloads")]);
      runtime = art; downloadsCap = dl;
    }
  } catch (e) { runtime = null; }
  if (!runtime) {
    /* no artifact runtime: try a sync server (Railway etc.), else per-browser demo mode */
    const synced = await initServerSync();
    if (!synced) {
      localOnly = true;
      try {
        const saved = JSON.parse(localStorage.getItem(LS_STATE));
        if (saved && saved.employees && saved.weeks) state = ensureReserved(saved);
      } catch(e){}
    }
  }
  render();
})();
</script>

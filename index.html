function renderAdminAvailability() {
  const wk = getWeek(ui.week);
  const workers = state.employees.filter(e => !e.admin && !e.pending);
  const submitted = workers.filter(w => wk.submissions[w.id] && wk.submissions[w.id].submittedAt);
  const shifts = state.settings.shifts;

  let stats =
    '<div class="stat-cards">' +
      '<div class="stat"><div class="v">' + submitted.length + " / " + workers.length + '</div><div class="k">Workers submitted</div></div>' +
      '<div class="stat"><div class="v">' + (wk.published ? "Live" : "Draft") + '</div><div class="k">Schedule status</div></div>' +
      '<div class="stat"><div class="v">' + (wk.locked ? "Closed" : "Open") + '</div><div class="k">Submissions</div></div>' +
    "</div>";

  let head = "<tr><th>Worker</th>" +
    Array.from({length:7}, (_, d) => "<th>" + DAY_SHORT[d] + "<small>" + fmtShort(dayDate(ui.week, d)) + "</small></th>").join("") +
    "</tr>";

  let body = workers.map(w => {
    const sub = wk.submissions[w.id];
    const status = sub && sub.submittedAt
      ? '<span class="pill good" style="font-size:10px;padding:2px 8px">✓</span>'
      : '<span class="pill neutral" style="font-size:10px;padding:2px 8px">–</span>';
    let cells = "";
    for (let d = 0; d < 7; d++) {
      cells += '<td><div class="mini-cells">' + shifts.map(sh => {
        const st = sub ? sub.cells[d + "." + sh.id] : undefined;
        return '<span class="mini ' + (st || "") + '" title="' + esc(sh.name) + '">' + esc(sh.name[0]) + "</span>";
      }).join("") + "</div></td>";
    }
    const note = sub && sub.note ? '<div class="st" title="' + esc(sub.note) + '">💬 ' + esc(sub.note.length > 34 ? sub.note.slice(0,34) + "…" : sub.note) + "</div>" : "";
    return "<tr><td><div class=\"emp-cell\">" +
      '<span class="avatar" style="width:26px;height:26px;font-size:10px">' + esc(initials(w.name)) + "</span>" +
      '<div><div class="nm">' + esc(w.name) + " " + status + "</div>" + note + "</div></div></td>" + cells + "</tr>";
  }).join("");

  if (!workers.length) body = '<tr><td colspan="8" style="color:var(--text-2)">No workers yet — add your team in the Team tab.</td></tr>';

  return stats +
    '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">' +
      "<div><h3>Availability submissions</h3>" +
      '<p class="sub">Each cell shows ' + shifts.map(s => esc(s.name[0]) + " = " + esc(s.name)).join(", ") + "</p></div>" +
      '<button class="btn secondary small" onclick="toggleLock()">' + (wk.locked ? "Reopen submissions" : "Close submissions") + "</button>" +
    "</div>" +
    '<div class="matrix-wrap"><table class="matrix"><thead>' + head + "</thead><tbody>" + body + "</tbody></table></div>" +
    '<div class="legend">' +
      '<span><span class="dot d-yes"></span>Available</span>' +
      '<span><span class="dot d-pref"></span>Preferred</span>' +
      '<span><span class="dot d-no"></span>Can\'t work</span>' +
      '<span><span class="dot d-unset"></span>No response</span>' +
    "</div></div>";
}

function renderAdminSchedule() {
  const wk = getWeek(ui.week);
  const shifts = state.settings.shifts;
  let totalAssigned = 0, totalNeeded = 0;

  let days = "";
  for (let d = 0; d < 7; d++) {
    const date = dayDate(ui.week, d);
    let rows = "";
    for (const sh of shifts) {
      const key = d + "." + sh.id;
      const need = state.settings.required[sh.id] || 0;
      const list = wk.assignments[key] || [];
      totalAssigned += list.length; totalNeeded += need;
      const busy = {};
      shifts.forEach(s2 => (wk.assignments[d + "." + s2.id] || []).forEach(id => busy[id] = (busy[id]||0)+1));
      const chips = list.map(id => {
        const emp = empById(id); if (!emp) return "";
        const av = (wk.submissions[id] || {cells:{}}).cells[key];
        const problem = av === "no" ? "Marked can't work" : (!av ? "No response" : (busy[id] > 1 ? "Double-booked today" : null));
        return '<span class="chip' + (problem ? " warnchip" : "") + '"' + (problem ? ' title="' + esc(problem) + '"' : "") + ">" +
          (problem ? "⚠︎ " : (av === "pref" ? "★ " : "")) + esc(emp.name) +
          '<button class="x" aria-label="Remove ' + esc(emp.name) + '" onclick="toggleAssign(' + d + ',\'' + sh.id + '\',\'' + id + '\')">✕</button></span>';
      }).join("");
      const countCls = list.length >= need ? "good" : (list.length ? "warn" : "neutral");
      rows += '<div class="shift-row">' +
        '<div class="s-label"><b>' + esc(sh.name) + "</b><small>" + sh.start + "–" + sh.end + "</small></div>" +
        '<span class="pill ' + countCls + ' count">' + list.length + " / " + need + "</span>" +
        '<div class="assigned">' + chips +
          '<button class="addbtn" onclick="openPicker(' + d + ',\'' + sh.id + '\')">+ Assign</button>' +
        "</div></div>";
    }
    days += '<div class="sched-day"><div class="sched-day-head"><h4>' + DAY_NAMES[d] + "</h4><small>" + fmtShort(date) + "</small></div>" + rows + "</div>";
  }

  const coverage = totalNeeded ? Math.round(100 * Math.min(totalAssigned, totalNeeded) / totalNeeded) : 0;

  return '<div class="stat-cards">' +
      '<div class="stat"><div class="v">' + coverage + '%</div><div class="k">Coverage vs. required</div></div>' +
      '<div class="stat"><div class="v">' + totalAssigned + '</div><div class="k">Shifts assigned</div></div>' +
      '<div class="stat"><div class="v">' + (wk.published ? "Live" : "Draft") + '</div><div class="k">Schedule status</div></div>' +
    "</div>" +
    '<div class="card">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">' +
      "<div><h3>Build the schedule</h3>" +
      '<p class="sub" style="margin:0">Auto-fill respects availability and balances shifts; ★ marks preferred, ⚠︎ marks conflicts.</p></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn secondary small" onclick="autoFill()">✦ Auto-fill</button>' +
        '<button class="btn secondary small" onclick="exportCsv()">Export CSV</button>' +
        '<button class="btn danger small" onclick="clearWeek()">Clear</button>' +
        '<button class="btn small" onclick="publishSchedule()">' + (wk.published ? "Unpublish" : "Publish schedule") + "</button>" +
      "</div>" +
    "</div>" + days + "</div>";
}

function openPicker(dayIdx, shiftId) { pickerCtx = { dayIdx, shiftId }; render(); }
function closePicker() { pickerCtx = null; render(); }

function renderPicker() {
  const { dayIdx, shiftId } = pickerCtx;
  const wk = getWeek(ui.week);
  const sh = state.settings.shifts.find(s => s.id === shiftId);
  const key = dayIdx + "." + shiftId;
  const assigned = new Set(wk.assignments[key] || []);
  const busy = new Set();
  state.settings.shifts.forEach(s2 => (wk.assignments[dayIdx + "." + s2.id] || []).forEach(id => busy.add(id)));

  const groups = { pref: [], yes: [], unset: [], no: [] };
  state.employees.filter(e => !assigned.has(e.id) && !e.pending).forEach(e => {
    const av = (wk.submissions[e.id] || {cells:{}}).cells[key];
    groups[av === "pref" ? "pref" : av === "yes" ? "yes" : av === "no" ? "no" : "unset"].push(e);
  });

  const totals = {};
  Object.values(wk.assignments).forEach(l => l.forEach(id => totals[id] = (totals[id]||0)+1));

  function rows(list) {
    return list.map(e =>
      '<button class="pick-row" onclick="toggleAssign(' + dayIdx + ',\'' + shiftId + '\',\'' + e.id + '\')">' +
        '<span class="avatar" style="width:26px;height:26px;font-size:10px">' + esc(initials(e.name)) + "</span>" +
        '<span class="nm">' + esc(e.name) + (busy.has(e.id) ? ' <span class="pill warn" style="font-size:10px;padding:1px 7px">on shift today</span>' : "") + "</span>" +
        '<span class="meta">' + (totals[e.id] || 0) + " this week</span>" +
      "</button>"
    ).join("");
  }
  const sections = [
    ["pref", "★ Preferred"], ["yes", "Available"], ["unset", "No response"], ["no", "Marked can't work"]
  ].filter(([k]) => groups[k].length).map(([k, label]) =>
    '<div class="pick-group g-' + k + '"><div class="g-label">' + label + "</div>" + rows(groups[k]) + "</div>"
  ).join("") || '<p class="sub">Everyone is already assigned to this shift.</p>';

  return '<div class="overlay" onclick="if(event.target===this)closePicker()"><div class="picker" role="dialog" aria-modal="true">' +
    "<h4>Assign — " + esc(sh.name) + "</h4>" +
    '<p class="sub">' + DAY_NAMES[dayIdx] + " " + fmtShort(dayDate(ui.week, dayIdx)) + " · " + sh.start + "–" + sh.end + "</p>" +
    sections +
    '<button class="btn secondary picker-close" onclick="closePicker()">Done</button>' +
  "</div></div>";
}

function renderAdminTeam() {
  const rows = state.employees.filter(e => !e.pending).map(e =>
    '<div class="team-row">' +
      '<span class="avatar">' + esc(initials(e.name)) + "</span>" +
      '<div class="info"><b>' + esc(e.name) + (e.admin ? ' <span class="pill accent" style="font-size:10px;padding:2px 8px">Admin</span>' : "") + "</b>" +
      "<small>" + esc(e.email) + "</small></div>" +
      '<button class="btn secondary small" onclick="toggleAdmin(\'' + e.id + '\')">' + (e.admin ? "Make worker" : "Make admin") + "</button>" +
      (serverMode ? '<button class="btn secondary small" onclick="resetTotp(\'' + esc(e.email) + '\')">Reset 2FA</button>' : "") +
      '<button class="btn danger small" onclick="removeEmployee(\'' + e.id + '\')">Remove</button>' +
    "</div>"
  ).join("");
  const pendingEmps = state.employees.filter(e => e.pending);
  const reqRows =
    accessRequests.map(q =>
      '<div class="team-row">' +
        '<span class="avatar">' + esc(initials(q.name || "?")) + "</span>" +
        '<div class="info"><b>' + esc(q.name) + "</b><small>" + esc(q.email) + "</small></div>" +
        '<button class="btn small" onclick="approveRequest(\'' + esc(q.email) + '\')">Approve</button>' +
        '<button class="btn danger small" onclick="declineRequest(\'' + esc(q.email) + '\')">Decline</button>' +
      "</div>"
    ).join("") +
    pendingEmps.map(e =>
      '<div class="team-row">' +
        '<span class="avatar">' + esc(initials(e.name)) + "</span>" +
        '<div class="info"><b>' + esc(e.name) + "</b><small>" + esc(e.email) + "</small></div>" +
        '<button class="btn small" onclick="approvePending(\'' + e.id + '\')">Approve</button>' +
        '<button class="btn danger small" onclick="removeEmployee(\'' + e.id + '\')">Decline</button>' +
      "</div>"
    ).join("");
  const reqCount = accessRequests.length + pendingEmps.length;
  const reqCard = reqCount
    ? '<div class="card"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><h3 style="margin:0">Access requests</h3>' +
      '<span class="pill warn">' + reqCount + "</span></div>" +
      '<p class="sub">People asking to join — they can\'t sign in or submit shifts until you approve.</p>' +
      reqRows + "</div>"
    : "";
  return reqCard + '<div class="card"><h3>Team</h3>' +
    '<p class="sub">' + (serverMode
      ? "Only these emails can sign in. New people request access from the sign-in screen and appear above for your approval."
      : "Workers sign in with their email — add them here, or they can join themselves from the sign-in screen.") + "</p>" +
    rows +
    '<div class="team-add">' +
      '<input id="add-name" placeholder="Full name" aria-label="New team member name">' +
      '<input id="add-email" type="email" placeholder="email@company.com" aria-label="New team member email">' +
      '<button class="btn" onclick="addEmployee(document.getElementById(\'add-name\').value, document.getElementById(\'add-email\').value)">Add</button>' +
    "</div></div>";
}

function renderAdminSettings() {
  const wk = getWeek(ui.week);
  const shiftRows = state.settings.shifts.map(sh =>
    '<div class="set-row">' +
      '<div class="lbl"><b>' + esc(sh.name) + ' shift</b><small>Start / end time</small></div>' +
      '<input type="time" value="' + sh.start + '" onchange="updateShiftTime(\'' + sh.id + '\',\'start\',this.value)" aria-label="' + esc(sh.name) + ' start">' +
      '<input type="time" value="' + sh.end + '" onchange="updateShiftTime(\'' + sh.id + '\',\'end\',this.value)" aria-label="' + esc(sh.name) + ' end">' +
    "</div>"
  ).join("");
  const reqRows = state.settings.shifts.map(sh =>
    '<div class="set-row">' +
      '<div class="lbl"><b>' + esc(sh.name) + '</b><small>Workers needed per day</small></div>' +
      '<input type="number" min="0" max="20" value="' + (state.settings.required[sh.id] || 0) + '" onchange="updateRequired(\'' + sh.id + '\',this.value)" aria-label="Required for ' + esc(sh.name) + '">' +
    "</div>"
  ).join("");
  return '<div class="card"><h3>Company</h3>' +
      '<div class="set-row"><div class="lbl"><b>Company name</b><small>Shown on the sign-in screen</small></div>' +
      '<input type="text" value="' + esc(state.settings.company) + '" onchange="updateCompany(this.value)" aria-label="Company name"></div></div>' +
    '<div class="card"><h3>Shift hours</h3><p class="sub">Applies to every week.</p>' + shiftRows + "</div>" +
    '<div class="card"><h3>Staffing requirements</h3><p class="sub">The schedule builder and auto-fill aim for these numbers.</p>' + reqRows + "</div>" +
    '<div class="card"><h3>This week (' + weekLabel(ui.week) + ")</h3>" +
      '<div class="set-row"><div class="lbl"><b>Accept submissions</b><small>Turn off to close availability changes for this week</small></div>' +
      '<button class="toggle ' + (wk.locked ? "" : "on") + '" role="switch" aria-checked="' + (!wk.locked) + '" aria-label="Accept submissions" onclick="toggleLock()"><span class="knob"></span></button></div>' +
      '<div class="set-row"><div class="lbl"><b>Schedule published</b><small>Workers can see their assigned shifts</small></div>' +
      '<button class="toggle ' + (wk.published ? "on" : "") + '" role="switch" aria-checked="' + (!!wk.published) + '" aria-label="Schedule published" onclick="publishSchedule()"><span class="knob"></span></button></div>' +
    "</div>";
}

/* ---------- boot ---------- */
(async function boot() {
  render();
  try {
    if (window.claude && typeof window.claude.use === "function") {
      const [art, dl] = await Promise.all([claude.use("artifact"), claude.use("downloads")]);
      runtime = art; downloadsCap = dl;
    }
  } catch (e) { runtime = null; }
  if (!runtime) {
    /* no artifact runtime: try a sync server (Railway etc.), else per-browser demo mode */
    const synced = await initServerSync();
    if (!synced) {
      try {
        const saved = JSON.parse(localStorage.getItem(LS_STATE));
        if (saved && saved.employees && saved.weeks) state = saved;
      } catch(e){}
    }
  }
  render();
})();
</script>
